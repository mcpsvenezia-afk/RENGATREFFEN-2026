<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CACHE RESET - Renga Treffen 2026</title>
    <style>
        body {
            background: linear-gradient(135deg, #16161e, #1a1b26);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1a1b26;
            border: 2px solid #E6007E;
            border-radius: 30px;
            padding: 50px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(230, 0, 126, 0.2);
        }

        h1 {
            color: #FFCC00;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 900;
        }

        p {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            background: #E6007E;
            color: #fff;
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(230, 0, 126, 0.3);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(230, 0, 126, 0.5);
        }

        .log {
            background: #000;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
            font-family: monospace;
            font-size: 0.9rem;
            color: #4CAF50;
            max-height: 300px;
            overflow-y: auto;
        }

        .log div {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧹 RESET CACHE TOTALE</h1>
        <p>
            Questo strumento eliminerà TUTTI i dati memorizzati localmente dall'app Race Tracker:
            <br><br>
            ✓ LocalStorage (sessioni piloti)<br>
            ✓ SessionStorage (dati temporanei)<br>
            ✓ Service Worker Cache (file offline)<br>
            ✓ IndexedDB (log pendenti)<br>
        </p>
        <button onclick="executeDeepClean()">ESEGUI PULIZIA PROFONDA</button>
        <div class="log" id="log"></div>
    </div>

    <script>
        function log(msg) {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function executeDeepClean() {
            log('🚀 Avvio procedura di pulizia...');

            // 1. Clear LocalStorage
            try {
                localStorage.clear();
                log('✅ LocalStorage pulito');
            } catch (e) {
                log('❌ Errore LocalStorage: ' + e.message);
            }

            // 2. Clear SessionStorage
            try {
                sessionStorage.clear();
                log('✅ SessionStorage pulito');
            } catch (e) {
                log('❌ Errore SessionStorage: ' + e.message);
            }

            // 3. Unregister Service Workers
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        log('✅ Service Worker rimosso: ' + registration.scope);
                    }
                } catch (e) {
                    log('❌ Errore Service Worker: ' + e.message);
                }
            }

            // 4. Clear Cache Storage
            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    for (let name of cacheNames) {
                        await caches.delete(name);
                        log('✅ Cache rimossa: ' + name);
                    }
                } catch (e) {
                    log('❌ Errore Cache: ' + e.message);
                }
            }

            // 5. Clear IndexedDB
            if ('indexedDB' in window) {
                try {
                    const databases = await indexedDB.databases();
                    for (let db of databases) {
                        indexedDB.deleteDatabase(db.name);
                        log('✅ IndexedDB rimosso: ' + db.name);
                    }
                } catch (e) {
                    log('⚠️ IndexedDB: cleanup manuale consigliato');
                }
            }

            log('');
            log('🎉 PULIZIA COMPLETATA! Ricarica la pagina o chiudi il browser.');

            setTimeout(() => {
                if (confirm('Vuoi ricaricare la pagina ora per applicare i cambiamenti?')) {
                    window.location.reload(true);
                }
            }, 2000);
        }
    </script>
</body>

</html>

name: 🧬 Blitz Heartbeat v1

on:
  schedule:
    - cron: '*/20 * * * *' # Ogni 20 minuti
  workflow_dispatch: # Permette l'esecuzione manuale per test

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso necessario per fare il push dei log
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 💓 Run Heartbeat Script
        run: node src/core/logic-heartbeat-v1.js

      - name: 📤 Commit & Push Auto-Snapshot
        run: |
          git config --global user.name "Blitz-Bot"
          git config --global user.email "blitz-bot@users.noreply.github.com"
          git add docs/heartbeats/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[BOT-HB] Auto-Snapshot - Heartbeat sync [skip ci]"
            git push origin main
          fi

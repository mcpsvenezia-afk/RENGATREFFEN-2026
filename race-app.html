<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEOPOINT PRO - Race Tracking</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">

    <!-- SOCIAL PREVIEW (OG TAGS) -->
    <meta property="og:title" content="Race App | Renga Treffen 2026">
    <meta property="og:description" content="Dashboard di monitoraggio e radar gara per il Renga Treffen.">
    <meta property="og:image" content="https://www.rengatreffen.it/og-image.png">
    <meta property="og:url" content="https://www.rengatreffen.it/race-app.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        :root {
            --bg-dark: #0c0c0e;
            --accent-red: #ff4444;
            --accent-yellow: #FFCC00;
            --accent-purple: #E6007E;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 1s ease;
        }

        body.login-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.4)), url('moto_race_hero_final.png');
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin: 0;
            font-weight: 900;
        }

        .auth-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 25px 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            margin-top: auto;
            margin-bottom: 20px;
            transform: translateY(0);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .race-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 900;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .bib-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-yellow);
            font-size: 2.2rem;
            text-align: center;
            padding: 12px;
            border-radius: 20px;
            font-weight: 950;
            outline: none;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .bib-input:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
        }

        .btn-main {
            width: 100%;
            padding: 25px;
            border-radius: 100px;
            border: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .btn-yellow {
            background: var(--accent-yellow);
            color: #000;
        }

        .team-info {
            text-align: center;
            margin-bottom: 40px;
        }

        .card-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 2px solid currentColor;
        }

        .photo-number {
            font-size: 3.5rem;
            font-weight: 950;
            margin: 10px 0;
            line-height: 1;
            color: #fff;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #4CAF50;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 10px #4CAF50;
        }

        .btn-shoot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            border: 8px solid rgba(255, 255, 255, 0.1);
            font-weight: 950;
            font-size: 1.2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-shoot:active {
            transform: scale(0.9) translateY(5px);
            background: var(--accent-yellow);
        }

        .power-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ff4444;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .mute-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-yellow);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .power-btn:hover {
            background: rgba(255, 68, 68, 0.2);
            color: #ff2222;
        }

        .footer {
            text-align: center;
            padding: 40px 0;
            color: #444;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #race-ui {
            display: none;
        }

        .dev-pill {
            display: none;
            background: rgba(230, 0, 126, 0.1);
            border: 1px solid #E6007E;
            color: #E6007E;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 auto 20px auto;
            align-items: center;
            gap: 10px;
        }

        .dev-dot {
            width: 8px;
            height: 8px;
            background: #E6007E;
            border-radius: 50%;
            box-shadow: 0 0 10px #E6007E;
        }
    </style>
</head>

<body>

    <div class="container" data-dna="RACE-CONTAINER" data-component="RACE-APP">
        <!-- ALERT SINCRONIZZAZIONE PENDENTE -->
        <div id="sync-alert"
            style="display:none; background: #ff4444; color:#fff; padding:10px; text-align:center; font-weight:950; font-size:0.7rem; letter-spacing:1px; animation: pulse 1s infinite; position: sticky; top:0; z-index:9999;">
            ⚠️ ATTENZIONE: FOTO IN CODA! SINCRONIZZA PRIMA DI SPEGNERE.
        </div>

        <header class="header"
            style="padding: 15px 0 0 0; display: flex; flex-direction: column; align-items: center; z-index: 10;">
            <div id="dev-pill" class="dev-pill">
                <div class="dev-dot"></div> DEV
            </div>

            <!-- AUTH HEADER COMPATTO -->
            <div id="race-title-group"
                style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px;">

                <!-- Logo RT (Stacked) -->
                <div
                    style="width: 42px; height: 42px; background: var(--accent-yellow); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
                    RT
                </div>

                <!-- Titolo (Stacked) -->
                <div
                    style="font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); line-height: 1;">
                    RENGA TREFFEN '26
                </div>

                <!-- Memorial Sottile -->
                <div style="margin-top: 2px;">
                    <span
                        style="font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.9); text-shadow: 0 2px 5px rgba(0,0,0,0.8);">
                        2° Memorial <span style="color: #FFCC00;">Antonio Armellin</span>
                    </span>
                </div>

                <!-- Status GPS -->
                <style>
                    /* RACE HEADER PRO STYLES */
                    .race-header-container {
                        display: none;
                        /* Gestito da JS */
                        flex-direction: column;
                        width: 100%;
                        background: linear-gradient(to bottom, #000000, #111111);
                        border-bottom: 1px solid #222;
                        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
                        margin-bottom: 5px;
                        padding-bottom: 10px;
                        position: relative;
                        z-index: 50;
                    }

                    .chrono-bar {
                        width: 100%;
                        text-align: center;
                        background: rgba(0, 30, 40, 0.6);
                        padding: 8px 0;
                        border-bottom: 1px solid rgba(0, 229, 255, 0.2);
                    }

                    #race-chrono {
                        font-family: 'Courier New', monospace;
                        font-size: 2.2rem;
                        font-weight: 900;
                        color: #00E5FF;
                        text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
                        letter-spacing: 2px;
                        line-height: 1;
                    }

                    .controls-row {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        padding: 10px 15px 0 15px;
                        width: 100%;
                        box-sizing: border-box;
                    }

                    .team-center-box {
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        padding: 0 10px;
                    }

                    #header-team-name {
                        font-size: 1.1rem;
                        font-weight: 900;
                        color: #fff;
                        text-transform: uppercase;
                        margin: 4px 0;
                        text-align: center;
                        line-height: 1.1;
                    }

                    .badge-pill-small {
                        font-size: 0.6rem;
                        padding: 3px 10px;
                        border-radius: 4px;
                        font-weight: 800;
                        text-transform: uppercase;
                        color: #000;
                        background: #FFCC00;
                        display: inline-block;
                        box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
                    }

                    .btn-race-icon {
                        width: 44px;
                        height: 44px;
                        border-radius: 12px;
                        border: 1px solid #333;
                        background: #1a1a1a;
                        color: #ccc;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 1.4rem;
                        cursor: pointer;
                        transition: all 0.2s;
                    }

                    .btn-race-icon:active {
                        transform: scale(0.95);
                        background: #333;
                    }

                    .btn-exit {
                        color: #ff4444;
                        border-color: rgba(255, 68, 68, 0.3);
                    }

                    .pilot-info-row {
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        gap: 15px;
                        margin-top: 5px;
                    }

                    .pilot-name-small {
                        font-size: 0.7rem;
                        color: #888;
                        font-weight: 700;
                        text-transform: uppercase;
                    }

                    .gps-status-small {
                        font-size: 0.65rem;
                        color: #4CAF50;
                        font-weight: 700;
                        display: flex;
                        align-items: center;
                        gap: 4px;
                    }

                    /* Hide legacy stuff */
                    #wake-status {
                        display: none !important;
                    }
                </style>

                <header>
                    <!-- PWA BANNER (Hidden by default, managed by JS) -->
                    <div id="install-banner" onClick="installPWA()"
                        style="display:none; position:absolute; top:0; left:0; width:100%; background:#FFCC00; color:#000; text-align:center; font-size:0.7rem; font-weight:800; padding:5px; z-index:100; cursor:pointer;">
                        📲 INSTALLA APP
                    </div>

                    <!-- NUOVO HEADER PRO (mostrato dopo il login) -->
                    <div id="race-header-info" class="race-header-container">

                        <!-- 1. CHRONO BAR -->
                        <div class="chrono-bar">
                            <div id="race-chrono">--:--</div>
                        </div>

                        <!-- 2. MAIN CONTROLS -->
                        <div class="controls-row">
                            <!-- SX: STOP -->
                            <button onclick="confirmLogout()" class="btn-race-icon btn-exit">🛑</button>

                            <!-- CENTER: TEAM -->
                            <div class="team-center-box">
                                <div id="team-badge" class="badge-pill-small">...</div>
                                <div id="header-team-name">TEAM</div>
                            </div>

                            <!-- DX: MUTE -->
                            <button onclick="toggleMute()" class="btn-race-icon">
                                <span id="mute-icon">🔔</span>
                            </button>
                        </div>

                        <!-- 3. PILOT & GPS -->
                        <div class="pilot-info-row">
                            <div id="header-pilot-name" class="pilot-name-small">Pilota</div>
                            <div class="gps-status-small">
                                <span style="font-size:10px;">●</span> GPS ON
                            </div>
                        </div>

                        <!-- HIDDEN COMPATIBILITY ELEMENTS (Prevents JS Crash) -->
                        <div style="display:none;">
                            <span id="penalty-status"></span>
                            <span id="penalty-timer"></span>
                        </div>
                    </div>
                </header>

                <!-- UI MODERNA BOTTOM-FIXED -->
                <style>
                    .auth-card-clean {
                        position: fixed;
                        bottom: 0;
                        left: 0;
                        width: 100%;
                        padding: 60px 20px 40px 20px;
                        /* Padding top maggiore per sfumatura */
                        background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.8) 40%, transparent 100%);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        z-index: 100;
                        box-sizing: border-box;
                    }

                    .btn-start-hero {
                        background: #FFCC00;
                        color: #000;
                        border: none;
                        padding: 22px;
                        border-radius: 16px;
                        /* Meno arrotondato, più tech */
                        font-size: 1.1rem;
                        font-weight: 900;
                        text-transform: uppercase;
                        letter-spacing: 2px;
                        width: 100%;
                        max-width: 400px;
                        box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
                        cursor: pointer;
                        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        /* gap rimosso */
                    }

                    .btn-start-hero:active {
                        transform: scale(0.96);
                    }

                    /* --- NUOVA DASHBOARD GARA 2.1 --- */
                    .photo-grid {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 15px;
                        position: relative;
                        margin: 10px auto 20px auto;
                        /* Alzato: margine top ridotto */
                        max-width: 400px;
                        padding: 10px;
                    }

                    .photo-slot {
                        aspect-ratio: 4/3;
                        background: #111;
                        border: 2px solid #333;
                        border-radius: 12px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        position: relative;
                        overflow: hidden;
                    }

                    .photo-slot.active {
                        border-color: var(--accent-yellow);
                        box-shadow: 0 0 15px rgba(255, 204, 0, 0.25);
                    }

                    .photo-slot.done {
                        border-color: #4CAF50;
                    }

                    .photo-slot .num {
                        font-size: 3rem;
                        font-weight: 900;
                        color: rgba(255, 255, 255, 0.1);
                        font-family: 'Arial Black', sans-serif;
                    }

                    .photo-slot img {
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        position: absolute;
                        top: 0;
                        left: 0;
                    }

                    .slot-check {
                        position: absolute;
                        bottom: 5px;
                        right: 5px;
                        background: #4CAF50;
                        color: #fff;
                        border-radius: 50%;
                        width: 24px;
                        height: 24px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 0.9rem;
                        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
                        z-index: 5;
                    }

                    /* Pulsante SINCRONIZZA MINI (Icona alto dx) */
                    .sync-mini-btn {
                        position: absolute;
                        top: -45px;
                        /* Nello spazio tra header e griglia */
                        right: 15px;
                        background: rgba(255, 204, 0, 0.2);
                        border: 1px solid rgba(255, 204, 0, 0.5);
                        color: #FFCC00;
                        width: 36px;
                        height: 36px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 1.2rem;
                        cursor: pointer;
                        z-index: 20;
                        backdrop-filter: blur(5px);
                    }

                    /* Pulsante OCCHIO GIGANTE (Bottom) */
                    .shoot-container {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        margin-top: 10px;
                        padding-bottom: 20px;
                    }

                    .shoot-eye-btn-large {
                        width: 110px;
                        height: 110px;
                        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e0e0e0 60%, #b0b0b0 100%);
                        border-radius: 50%;
                        border: 8px solid rgba(255, 255, 255, 0.1);
                        box-shadow: 0 0 40px rgba(255, 255, 255, 0.3), inset 0 -5px 15px rgba(0, 0, 0, 0.2);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 3.5rem;
                        cursor: pointer;
                        color: #000;
                        position: relative;
                        transition: transform 0.1s;
                    }

                    .shoot-eye-btn-large:active {
                        transform: scale(0.92);
                    }

                    .shoot-eye-btn-large::after {
                        content: '';
                        position: absolute;
                        inset: -12px;
                        border-radius: 50%;
                        border: 2px dashed rgba(255, 255, 255, 0.3);
                        animation: rotate-ring 10s linear infinite;
                    }

                    @keyframes rotate-ring {
                        from {
                            transform: rotate(0deg);
                        }

                        to {
                            transform: rotate(360deg);
                        }
                    }

                    /* CRONOMETRO */
                    .chrono-widget {
                        background: rgba(0, 0, 0, 0.6);
                        border: 2px solid #00E5FF;
                        color: #00E5FF;
                        padding: 5px 10px;
                        border-radius: 8px;
                        font-family: 'Courier New', monospace;
                        font-weight: 900;
                        font-size: 1.2rem;
                        text-shadow: 0 0 10px #00E5FF;
                        box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
                        display: inline-block;
                    }
                </style>

                <div id="auth-ui" class="auth-card-clean" data-dna="4000-AUTH" data-component="LOGIN">
                    <!-- SCHERMATA INIZIALE -->
                    <div id="login-step-1" style="text-align: center; width: 100%;">
                        <button onclick="toggleLogin(true)" class="btn-start-hero">
                            VAI ALLA GARA
                        </button>
                        <div
                            style="font-size: 0.65rem; color: rgba(255,255,255,0.5); margin-top: 20px; text-transform: uppercase; font-weight: 700; letter-spacing: 2px;">
                            ACCESSO RISERVATO AI TEAM
                        </div>
                    </div>

                    <!-- SCHERMATA INPUT (Dentro auth-ui per gestire toggle) -->
                    <div id="login-step-2" style="display:none; width: 100%; text-align: center;">
                        <div class="input-group">
                            <label style="color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Numero Gara +
                                Pilota</label>
                            <input type="text" id="bib-number" class="bib-input" placeholder="es: 1A o 2B"
                                data-dna="4001-BIB-INPUT" autocomplete="off"
                                style="border-color: rgba(255,204,0,0.5); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
                        </div>
                        <button onclick="handleLogin()" class="btn-main btn-yellow"
                            style="padding: 15px; font-size: 1rem; width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.5);"
                            data-dna="4002-LOGIN-BTN">
                            ENTRA ORA
                        </button>
                        <div onclick="toggleLogin(false)"
                            style="text-align:center; margin-top: 20px; color:#fff; font-size:0.7rem; cursor:pointer; text-transform:uppercase; font-weight:900; text-decoration: underline;">
                            Indietro
                        </div>
                    </div>
                </div>
            </div>

            <!-- RACE SCREEN -->
            <!-- DNA: [URL:https://www.rengatreffen.it/race-app ID:5000-RACE-ENGINE] -->
            <div id="race-ui" class="race-card" data-dna="5000-RACE-ENGINE" data-component="RACE-ENGINE"
                style="position: relative; padding-top: 10px;">

                <!-- SYNC MINI (Alto DX sulla griglia) -->
                <button onclick="syncOfflineData()" class="sync-mini-btn" title="Sincronizza Dati">
                    🔄
                </button>

                <!-- GRID FOTO 4 SLOT (Senza occhio centrale) -->
                <div class="photo-grid">
                    <div class="photo-slot" id="slot-1">
                        <div class="num">1</div>
                    </div>
                    <div class="photo-slot" id="slot-2">
                        <div class="num">2</div>
                    </div>
                    <div class="photo-slot" id="slot-3">
                        <div class="num">3</div>
                    </div>
                    <div class="photo-slot" id="slot-4">
                        <div class="num">4</div>

    <script type="module">
        import { supabase } from '/src/lib/supabaseClient.js';

        // 🛡️ SESSIO VARIABLES
        let currentTeam = null;

        // 🛡️ WAKE LOCK ENGINE
        async function requestWakeLock() {

        let deferredPrompt;

        // 🌟 PWA INSTALL LOGIC

        // 🔄 SYNC ENGINE
        async function syncOfflineData() {
            if (!appConfig.enable_offline_sync) return;
            if (!navigator.onLine || pendingLogs.length === 0) {
                updateSyncStatus();
                return;
            }

            console.log(`[SYNC] Tentativo invio di ${pendingLogs.length} log pendenti...`);
            const stillPending = [];

            for (const log of pendingLogs) {
                try {
                    const { error } = await supabase.from('race_logs').insert([log]);
                    if (error) throw error;
                    console.log("[SYNC] Log inviato con successo!");
                } catch (err) {
                    console.error("[SYNC] Errore invio log:", err);
                    stillPending.push(log);

            pendingLogs = stillPending;
            localStorage.setItem('RENGATREFFEN_PENDING_LOGS', JSON.stringify(pendingLogs));

            if (syncAlert) {
                syncAlert.style.display = pendingLogs.length > 0 ? 'block' : 'none';
            }

        // 📏 DISTANCE CALC (Haversine)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 🔊 AUDIO ALARM
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 880, duration = 0.2) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        function triggerProximityAlarm() {
            if (isMuted || !appConfig.enable_proximity_audio) return;
            let count = 0;
            const interval = setInterval(() => {
                playBeep(440, 0.4);
                count++;
                if (count >= 5) clearInterval(interval);
            }, 800);
        }

        window.toggleMute = function () {
            isMuted = !isMuted;
            localStorage.setItem('RENGATREFFEN_MUTED', isMuted);
            document.getElementById('mute-icon').innerText = isMuted ? '🔕' : '🔔';
            if (!isMuted && audioCtx.state === 'suspended') audioCtx.resume();
        }

        // 📡 LIVE TRACKING ENGINE (Watch Position per Background)
        // 📡 LIVE TRACKING ENGINE (Watch Position per Background)
        // 📡 LIVE TRACKING ENGINE (Polled Interval per maggiore affidabilità su mobile)
        let lastGpsUpdate = Date.now(); // Init to now to avoid immediate restart
        let gpsInterval = null;

        async function logTrackingDebug(type, payload) {
            try {
                await supabase.from('tracking_debug_logs').insert({
                    registration_id: currentTeam.id,
                    pilot_code: currentPilot,
                    log_type: type,
                    payload: payload
                });
            } catch (e) { console.warn("Debug Log Failed", e); }
        }

        // 📡 LIVE TRACKING ENGINE (Polled Interval + FORCE-GPS)
        function startLiveTracking() {
            if (!currentTeam) return;

            const startGpsEngine = () => {
                if (gpsInterval) clearInterval(gpsInterval);
                console.log("[GPS] Starting Engine...");

                gpsInterval = setInterval(() => {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        lastGpsUpdate = Date.now();

                        // 1. Invia la mia posizione (Se abilitato)
                        if (appConfig.enable_live_tracking) {
                            const { error } = await supabase.from('live_tracking').upsert({
                                registration_id: currentTeam.id,
                                pilot_code: currentPilot,
                                gps_lat: pos.coords.latitude,
                                gps_lng: pos.coords.longitude,
                                last_seen: new Date().toISOString()
                            }, { onConflict: 'registration_id,pilot_code' });

                            if (error) {
                                console.error("[LIVE] Upsert error:", error);
                                logTrackingDebug('DB_ERROR', { error });
                            } else {
                                console.log("[LIVE] Posizione aggiornata per " + (currentTeam.bib_number || '?'));
                                document.getElementById('wake-status').innerText = 'GPS: OK 🟢';

                                // HEARTBEAT LOG (Debug)
                                logTrackingDebug('HEARTBEAT', {
                                    lat: pos.coords.latitude,
                                    lng: pos.coords.longitude,
                                    acc: pos.coords.accuracy
                                });
                            }
                        }
                    }, (err) => {
                        console.warn("[LIVE] Errore GPS:", err);
                        document.getElementById('wake-status').innerText = 'GPS: ERRORE 🔴';
                        logTrackingDebug('GPS_ERROR', { code: err.code, msg: err.message });
                    }, {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    });
                }, 5000); // Aggiorna ogni 5 secondi
            };

            // Avvio iniziale
            startGpsEngine();

            // FORCE-GPS CHECK (Ogni 10s controlla se siamo in stallo da > 30s)
            setInterval(() => {
                const now = Date.now();
                const delta = now - lastGpsUpdate;
                if (delta > 30000) {
                    console.warn(`⚠️ GPS STALL DETECTED (${Math.floor(delta / 1000)}s)! Restarting...`);
                    document.getElementById('wake-status').innerText = 'GPS: STALLO ⚠️';
                    logTrackingDebug('GPS_STALL', { last_update_ago_sec: Math.floor(delta / 1000) });

                    // Tentativo di rianimazione
                    startGpsEngine();
                    requestWakeLock();
                }
            }, 10000);

            // 2. Controlla Partner (Separato)
            setInterval(async () => {
                const partnerCode = currentPilot === 'A' ? 'B' : 'A';
                const { data: partner } = await supabase
                    .from('live_tracking')
                    .select('gps_lat, gps_lng, last_seen')
                    .eq('registration_id', currentTeam.id)
                    .eq('pilot_code', partnerCode)
                    .maybeSingle();

                if (partner) {
                    partnerLocation = { lat: partner.gps_lat, lng: partner.gps_lng };
                    // Logica distanza rimossa per semplicità ora, ma i dati ci sono.
                }
            }, 10000); // Check partner ogni 10s
        }

        // Batti il colpo ogni 30 secondi
        setInterval(syncOfflineData, 30000);
        window.addEventListener('online', syncOfflineData);

        function updateSyncStatus() {
            const pill = document.querySelector('#race-header-info .status-pill');
            if (!pill) return;

            if (pendingLogs.length > 0) {
                pill.innerHTML = `<div class="dot" style="background:#FFCC00; box-shadow:0 0 10px #FFCC00"></div> ${pendingLogs.length} PENDENTE`;
                pill.style.color = '#FFCC00';
            } else {
                pill.innerHTML = `<div class="dot"></div> PRONTO`;
                pill.style.color = '#4CAF50';
            }
        }

        window.toggleLogin = function (show) {
            document.getElementById('login-step-1').style.display = show ? 'none' : 'block';
            document.getElementById('login-step-2').style.display = show ? 'block' : 'none';
            if (show) setTimeout(() => document.getElementById('bib-number').focus(), 300);

        // 🚪 KILL-SWITCH: Spegni GPS e Logout
        window.confirmLogout = async function () {
            const result = await Swal.fire({
                title: '🚪 CONFERMA USCITA',
                text: 'Vuoi davvero uscire? Il tuo marker verrà rimosso dal Radar.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sì, Esci',

            });

            if (result.isConfirmed) {

        window.executeLogout = async function () {
            console.log('[LOGOUT] Esecuzione kill-switch...');

            // 1. Stop GPS Tracking
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // 2. Set Pilot OFFLINE in Database (delete record or set null coords)
            if (currentTeam && currentTeam.id) {
                try {
                    const { error } = await supabase
                        .from('live_tracking')
                        .delete()
                        .eq('registration_id', currentTeam.id)
                        .eq('pilot_code', currentPilot);

                    if (error) {
                        console.error('[LOGOUT] Failed to remove from live_tracking:', error);
                    } else {
                        console.log('[LOGOUT] Rimosso da radar con successo');
                    }
                } catch (e) {
                    console.warn('[LOGOUT] Error during cleanup:', e);
                }
            }

            // 3. Clear Local Session
            localStorage.removeItem('RENGATREFFEN_SESSION');
            localStorage.removeItem('RENGATREFFEN_PENDING_LOGS');

            // 4. Reload App
            console.log('[LOGOUT] Sessione cancellata. Reload...');
            window.location.reload();
        }

        window.handleLogin = async function () {
            const btn = document.querySelector('button[data-dna="4002-LOGIN-BTN"]');
            const originalText = btn.innerText;

            try {
                let rawBib = document.getElementById('bib-number').value.trim().toUpperCase();
                if (!rawBib) return;

                // Feedback Visivo
                btn.innerText = "⏳ VERIFICA...";
                btn.style.opacity = "0.7";
                btn.disabled = true;

                // DNA-DEEP-CLEAN: Remove duplicate letters (e.g. 1AA -> 1A)
                const cleanBib = rawBib.replace(/([A-Z])\1+/gi, '$1');
                if (rawBib !== cleanBib) {
                    console.log(`[DNA-CLEAN] ID ORIGINALE: ${rawBib} -> ID PULITO: ${cleanBib}`);
                    rawBib = cleanBib;
                }

                // Parsing: 1A -> bib=1, pilot=A
                const match = rawBib.match(/^(\d+)([AB])$/);
                if (!match) {
                    throw new Error("FORMATO_NON_VALIDO");
                }

                const bib = match[1];
                currentPilot = match[2];

                // FIX: Ora cerchiamo il numero COMPLETO (es: "1A") perché nel DB sono salvati così
                const { data, error } = await supabase
                    .from('registrations')
                    .select('*')
                    .eq('bib_number', rawBib)
                    .limit(1);

                if (error || !data || data.length === 0) {
                    console.group("❌ Login Failed");
                    console.log("Input Bib:", rawBib);
                    console.log("Supabase Error:", error);
                    console.groupEnd();

                    Swal.fire({
                        title: 'TEAM NON TROVATO',
                        text: `Il numero gara "${rawBib}" non risulta assegnato nel database. \n\nPROVA COSÌ:\n1. Vai nel pannello Admin > Impostazioni\n2. Clicca su "🚀 ASSEGNA PETTORALI"\n3. Assicurati che lo stato sia "Confermata" o "Verifica".`,
                        icon: 'error',
                        background: '#111',
                        color: '#fff'
                    });
                    return;
                }

                currentTeam = data[0];

                // Save Session
                localStorage.setItem('RENGATREFFEN_SESSION', JSON.stringify({
                    team: currentTeam,
                    pilot: currentPilot
                }));

                // 🧬 Recupara il numero foto corretto per questo pilota
                // Se sono Capitano (A), conto i log 'A' + quelli legacy (senza codice)
                // Se sono Partner (B), conto solo i log 'B'
                const pilotFilter = currentPilot === 'A'
                    ? 'pilot_code.eq.A,pilot_code.is.null'
                    : 'pilot_code.eq.B';

                const { count } = await supabase
                    .from('race_logs')
                    .select('*', { count: 'exact', head: true })
                    .eq('registration_id', currentTeam.id)
                    .or(pilotFilter);

                const localCountForTeam = pendingLogs.filter(l =>
                    l.registration_id === currentTeam.id &&
                    (currentPilot === 'A' ? (l.pilot_code === 'A' || !l.pilot_code) : l.pilot_code === 'B')
                ).length;

                photoNumber = (count || 0) + localCountForTeam + 1;
                updateUI();
                startLiveTracking();
                requestWakeLock();
                syncOfflineData();
            } catch (error) {
                console.error("Login Error:", error);
                Swal.fire({
                    title: 'ERRORE ACCESSO',
                    text: error.message || 'Errore di connessione o codice non valido.',
                    icon: 'error',
                    background: '#111',
                    color: '#fff'
                });
            } finally {
                if (btn) {
                    btn.innerText = originalText;
                    btn.style.opacity = "1";
                    btn.disabled = false;
                }
            }
        }

        let chronoInterval = null;

        function startRaceTimer() {
            if (chronoInterval) clearInterval(chronoInterval);

            if (!currentTeam || !currentTeam.departure_time) {
                document.getElementById('race-chrono').innerText = "--:--";
                return;
            }

            const updateChrono = () => {
                // Parse departure_time "HH:MM:SS" -> Date Object for TODAY
                const [hh, mm, ss] = currentTeam.departure_time.split(':');
                const now = new Date();
                const departure = new Date();
                departure.setHours(parseInt(hh), parseInt(mm), parseInt(ss || 0), 0);

                const diff = now - departure; // millisecondi

                const element = document.getElementById('race-chrono');
                if (!element) return;

                if (diff < 0) {
                    // Conto alla rovescia (Futuro)
                    const absDiff = Math.abs(diff);
                    const m = Math.floor((absDiff / 1000 / 60) % 60);
                    const s = Math.floor((absDiff / 1000) % 60);
                    element.innerText = `-${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    element.style.color = '#ff4444'; // Rosso attesa
                } else {
                    // Gara in corso
                    const h = Math.floor(diff / (1000 * 60 * 60));
                    const m = Math.floor((diff / 1000 / 60) % 60);
                    const s = Math.floor((diff / 1000) % 60);

                    if (h > 0) {
                        element.innerText = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    } else {
                        element.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }
                    element.style.color = '#00E5FF'; // Ciano Gara
                }
            };

            updateChrono(); // Subito
            chronoInterval = setInterval(updateChrono, 1000);
        }

        function updateUI() {
            if (!currentTeam) return;

            const color = currentTeam.card_color || 'GIALLA';
            const badge = document.getElementById('team-badge');
            if (badge) {
                badge.innerText = `SCHEDA ${color}`;
                badge.style.backgroundColor = color === 'ROSSA' ? '#ff4444' : (color === 'GIALLA' ? '#FFCC00' : '#E6007E');
                badge.style.color = '#000'; // Nero su colore vivido
            }

            // Header Updates
            const pilotName = currentPilot === 'A'
                ? `${currentTeam.nome || ''} ${currentTeam.cognome || ''}`.trim()
                : `${currentTeam.secondo_nome || ''} ${currentTeam.secondo_cognome || ''}`.trim();

            document.getElementById('header-team-name').innerText = (currentTeam.team_name || 'SENZA NOME').toUpperCase();
            document.getElementById('header-pilot-name').innerText = `Ciao ${pilotName || 'Pilota'}`;

            // IMPORTANT: Use FLEX for layout
            const headerInfo = document.getElementById('race-header-info');
            if (headerInfo) headerInfo.style.display = 'flex';

            document.getElementById('race-title-group').style.display = 'none';

            // GESTIONE GRIGLIA FOTO
            document.querySelectorAll('.photo-slot').forEach(el => el.classList.remove('active'));
            const currentSlot = document.getElementById(`slot-${photoNumber}`);
            if (currentSlot) {
                currentSlot.classList.add('active');
            }

            // Mark previous slots as done
            for (let i = 1; i < photoNumber; i++) {
                const s = document.getElementById(`slot-${i}`);
                if (s && !s.classList.contains('done')) {
                    s.classList.add('done');
                    if (!s.querySelector('.slot-check')) s.innerHTML += '<div class="slot-check">✔</div>';
                }
            }

            // Main UI Switch
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('race-ui').style.display = 'block';
            document.body.classList.remove('login-bg');
            updateSyncStatus();

            // Mute Icon
            const muteIcon = document.getElementById('mute-icon');
            if (muteIcon) muteIcon.innerText = isMuted ? '🔕' : '🔔';

            // Start Chrono
            startRaceTimer();
        }



        // Restore Session on Startup
        async function checkAutoLogin() {
            if (currentTeam && !currentTeam.id) {
                console.warn("[SESSION] Invalid Team ID, clearing session.");
                localStorage.removeItem('RENGATREFFEN_SESSION');
                currentTeam = null;
                return;
            }

            if (currentTeam) {
                // Try fetching extra team data (like penalty seconds)
                try {
                    const { data: teamData, error: teamError } = await supabase
                        .from('registrations')
                        .select('separation_seconds')
                        .eq('id', currentTeam.id)
                        .maybeSingle();

                    if (teamError) {
                        console.warn("[SESSION] Error fetching team details (RLS?):", teamError.code);
                    } else if (teamData) {
                        separationSeconds = teamData.separation_seconds || 0;
                    }
                } catch (e) {
                    console.warn("[SESSION] Critical fetch error:", e);
                }

                // Continue with logs fetching regardless of team detail success
                const pilotFilter = currentPilot === 'A'
                    ? 'pilot_code.eq.A,pilot_code.is.null'
                    : 'pilot_code.eq.B';

                const { count } = await supabase
                    .from('race_logs')
                    .select('*', { count: 'exact', head: true })
                    .eq('registration_id', currentTeam.id)
                    .or(pilotFilter);

                const localCountForTeam = pendingLogs.filter(l =>
                    l.registration_id === currentTeam.id &&
                    (currentPilot === 'A' ? (l.pilot_code === 'A' || !l.pilot_code) : l.pilot_code === 'B')
                ).length;
                photoNumber = (count || 0) + localCountForTeam + 1;
                updateUI();
                startLiveTracking();
                requestWakeLock();
            }
        }
        async function initApp() {
            await fetchAppConfig(); // Load features first
            checkAutoLogin();
        }

        // Init
        setTimeout(initApp, 500);

        // 📸 LOGICA FOTOCAMERA
        window.triggerCamera = function () {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            // Check proximity (se partnerLocation disponibile)
            if (partnerLocation) {
                // Get current cached pos if possible, o aspetta?
                // Per ora usiamo l'ultima nota dal watchPosition o chiediamo nuova
                navigator.geolocation.getCurrentPosition((pos) => {
                    // Se controllo disabilitato remotamente o dev mode locale/remoto -> bypass
                    if (!appConfig.enable_photo_distance_check || isDevMode) {
                        // Bypass Check
                    } else {
                        const dist = getDistance(pos.coords.latitude, pos.coords.longitude, partnerLocation.lat, partnerLocation.lng);
                        if (dist > 20) {
                            Swal.fire({
                                title: '⛔ TROPPO LONTANI',
                                text: `Per scattare dovete essere a max 20m. Distanza attuale: ${dist.toFixed(0)}m\n(DEV MODE bypass disponibile)`,
                                icon: 'error',
                                background: '#111',
                                color: '#fff'
                            });
                            return;
                        }
                    }
                    document.getElementById('camera-input').click();
                }, () => {
                    // Se GPS fallisce nel check veloce, permettiamo comunque? 
                    // No, per regolamento serve GPS.
                    Swal.fire({ title: 'ERRORE GPS', text: 'Impossibile verificare distanza dal partner.', icon: 'error' });
                }, { enableHighAccuracy: true, timeout: 5000 });
            } else {
                // Se non c'è mai stato un segnale partner, permettiamo? 
                // Meglio di sì o rischiamo blocchi se l'altro pilota non ha segnale.
                document.getElementById('camera-input').click();
            }
        }

        window.processCameraSelection = async function (event) {
            const file = event.target.files[0];
            if (file) {
                // 📸 SHOW PREVIEW IN SLOT IMMEDIATE
                try {
                    const slot = document.getElementById(`slot-${photoNumber}`);
                    if (slot) {
                        const img = document.createElement('img');
                        img.src = URL.createObjectURL(file);

                        // Clean previous num
                        const numDiv = slot.querySelector('.num');
                        if (numDiv) numDiv.style.display = 'none';
                        const oldImg = slot.querySelector('img');
                        if (oldImg) oldImg.remove();
                        const oldCh = slot.querySelector('.slot-check');
                        if (oldCh) oldCh.remove();

                        slot.appendChild(img);
                        slot.classList.add('done'); // Bordo verde momentaneo
                        slot.innerHTML += '<div class="slot-check" id="temp-spinner">⏳</div>';
                    }
                } catch (e) { console.warn("Preview error", e); }

                handleShoot();
            }
        }

        // 📉 IMAGE COMPRESSION ENGINE
        async function compressImage(file) {
            return new Promise((resolve) => {
                const maxWidth = 1280;
                const maxHeight = 1280;
                const quality = 0.7; // 70%

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        window.handleShoot = async function () {
            const btn = document.getElementById('shoot-btn');
            const fileInput = document.getElementById('camera-input');
            const originalFile = fileInput.files[0];

            if (!originalFile) {
                Swal.fire('Errore', 'Nessuna foto acquisita.', 'error');
                return;
            }

            btn.disabled = true;
            btn.style.opacity = '0.5';

            // 📉 Compress before anything else
            let file;
            try {
                file = await compressImage(originalFile);
            } catch (err) {
                console.warn("Compression failed, using original", err);
                file = originalFile;
            }

            // Upload Logic (Storage) - Placeholder se non attivo
            // Per ora salviamo solo il log, l'immagine è locale nel form (pending upload se volessimo)
            let publicUrl = null;
            // TODO: Implement Storage Upload if needed for persistence

            const saveData = async (pos) => {
                const newLog = {
                    registration_id: currentTeam.id,
                    photo_number: photoNumber,
                    pilot_code: currentPilot,
                    gps_lat: pos ? pos.coords.latitude : null,
                    gps_lng: pos ? pos.coords.longitude : null,
                    gps_alt: pos ? pos.coords.altitude : null,
                    photo_url: publicUrl, // null per ora
                    client_timestamp: new Date().toISOString()
                };

                try {
                    // Proviamo ad inviare subito se online
                    const { error } = await supabase.from('race_logs').insert([newLog]);
                    if (error) throw error;

                    // Success Feedback (Toast)
                    Swal.fire({
                        toast: true,
                        position: 'center',
                        title: 'FOTO OK',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false,
                        background: '#111', color: '#4CAF50'
                    });

                    // Mark slot as permanently done (green check)
                    const slot = document.getElementById(`slot-${photoNumber}`);
                    if (slot) {
                        const sp = slot.querySelector('#temp-spinner');
                        if (sp) { sp.innerText = '✔'; sp.id = ''; }
                    }

                } catch (err) {
                    console.warn("Offline o Errore DB, salvo localmente:", err);
                    pendingLogs.push(newLog);
                    localStorage.setItem('RENGATREFFEN_PENDING_LOGS', JSON.stringify(pendingLogs));
                }

                // Incremento SOLO SE era l'ultima
                if (photoNumber < 4) {
                    photoNumber++;
                } else {
                    // Gara finita?
                    Swal.fire({ title: 'GARA COMPLETATA!', text: 'Hai scattato tutte le 4 foto.', icon: 'success' });
                }

                updateUI();
                btn.disabled = false;
                btn.style.opacity = '1';
                // btn.innerHTML = ... NEW ICON? No keep eye.
                fileInput.value = "";
            };

            // Get Pos & Save
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => saveData(pos), () => saveData(null), { timeout: 5000 });
            } else {
                saveData(null);
            }
        }

        // --- MANAJEMENT FUNCTIONS ---

        // Rendi gli slot cliccabili per "tornare indietro"
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.photo-slot').forEach(slot => {
                slot.onclick = function () {
                    const num = parseInt(this.id.split('-')[1]);
                    // Cambio foto corrente
                    photoNumber = num;
                    updateUI();

                    Swal.fire({
                        toast: true, position: 'top', icon: 'info',
                        title: `Selezionata Foto ${num}`, showConfirmButton: false, timer: 1000,
                        background: '#222', color: '#FFCC00'
                    });
                }
            });
        });

        // Funzione Reset (da chiamare col tasto nascosto)
        window.resetTestMode = async function () {
            if (!currentTeam) return;

            const confirm = await Swal.fire({
                title: 'RESET FOTO?',
                text: "Vuoi cancellare tutte le foto scattate e ripartire dalla n.1?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sì, Reset',
                cancelButtonText: 'Annulla',
                background: '#000', color: '#fff'
            });

            if (!confirm.isConfirmed) return;

            // Delete from DB
            await supabase.from('race_logs').delete().eq('registration_id', currentTeam.id).eq('pilot_code', currentPilot);

            // Clear Local
            pendingLogs = [];
            localStorage.setItem('RENGATREFFEN_PENDING_LOGS', '[]');

            // Reset Vars
            photoNumber = 1;

            // Clear UI
            document.querySelectorAll('.photo-slot img').forEach(i => i.remove());
            document.querySelectorAll('.photo-slot .slot-check').forEach(i => i.remove());
            document.querySelectorAll('.photo-slot .num').forEach(n => n.style.display = 'block');
            document.querySelectorAll('.photo-slot').forEach(s => s.classList.remove('done', 'active'));

            updateUI();
        }


        window.logout = function () {
            if (!confirm("VUOI USCIRE DALLA SESSIONE DI GARA?")) return;
            localStorage.removeItem('RENGATREFFEN_SESSION');
            currentTeam = null;
            document.body.classList.add('login-bg');
            document.getElementById('race-title-group').style.display = 'block';
            document.getElementById('race-header-info').style.display = 'none';
            document.getElementById('auth-ui').style.display = 'block';
            document.getElementById('race-ui').style.display = 'none';
        }

        window.resetTestMode = function () {
            if (confirm("VUOI AZZERARE I LOG LOCALI E REINIZIARE IL TEST?")) {
                localStorage.removeItem('RENGATREFFEN_PENDING_LOGS');
                location.reload();
            }
        }

        // Prova a sincronizzare all'avvio
        syncOfflineData();

        // 🛠️ SERVICE WORKER REGISTRATION (OFFLINE SUPPORT)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('[PWA] Service Worker registrato con successo.');
                }).catch(err => {
                    console.error('[PWA] Errore registrazione SW:', err);
                });
            });
        }
    </script>

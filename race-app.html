<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race App | Renga Treffen 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-dark: #0c0c0e;
            --accent-red: #ff4444;
            --accent-yellow: #FFCC00;
            --accent-purple: #E6007E;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin: 0;
            font-weight: 900;
        }

        .auth-card,
        .race-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 900;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .bib-input {
            width: 100%;
            background: #000;
            border: 2px solid #333;
            color: var(--accent-yellow);
            font-size: 3rem;
            text-align: center;
            padding: 20px;
            border-radius: 25px;
            font-weight: 900;
            outline: none;
            transition: 0.3s;
        }

        .bib-input:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
        }

        .btn-main {
            width: 100%;
            padding: 25px;
            border-radius: 100px;
            border: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .btn-yellow {
            background: var(--accent-yellow);
            color: #000;
        }

        .team-info {
            text-align: center;
            margin-bottom: 40px;
        }

        .card-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 2px solid currentColor;
        }

        .photo-number {
            font-size: 5rem;
            font-weight: 950;
            margin: 20px 0;
            line-height: 1;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #4CAF50;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 10px #4CAF50;
        }

        .btn-shoot {
            flex: 1;
            margin-top: 40px;
            background: #fff;
            color: #000;
            height: 120px;
            border-radius: 60px;
            border: none;
            font-weight: 950;
            font-size: 1.5rem;
            box-shadow: 0 20px 50px rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .btn-shoot:active {
            transform: scale(0.95);
        }

        .footer {
            text-align: center;
            padding: 40px 0;
            color: #444;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #race-ui {
            display: none;
        }

        .dev-pill {
            display: none;
            background: rgba(230, 0, 126, 0.1);
            border: 1px solid #E6007E;
            color: #E6007E;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 auto 20px auto;
            align-items: center;
            gap: 10px;
        }

        .dev-dot {
            width: 8px;
            height: 8px;
            background: #E6007E;
            border-radius: 50%;
            box-shadow: 0 0 10px #E6007E;
        }
    </style>
</head>

<body>

    <div class="container" data-dna="RACE-CONTAINER" data-component="RACE-APP">
        <header class="header">
            <div id="dev-pill" class="dev-pill">
                <div class="dev-dot"></div> MODO DEV ATTIVO
            </div>
            <h1 class="logo">RENGATREFFEN <span style="color: #FFCC00">RACE</span></h1>
        </header>

        <!-- PWA INSTALL BANNER (Solo se supportato) -->
        <div id="install-banner"
            style="display:none; background: #FFCC00; color:#000; padding:15px; border-radius:15px; margin-bottom:20px; font-weight:900; cursor:pointer; text-transform:uppercase; font-size:0.8rem; text-align:center;">
            📲 AGGIUNGI ALLA HOME PER MASSIMA STABILITÀ
        </div>

        <!-- AUTH SCREEN -->
        <!-- DNA: [URL:https://www.rengatreffen.it/race-app ID:4000-AUTH] -->
        <div id="auth-ui" class="auth-card" data-dna="4000-AUTH" data-component="LOGIN">
            <div class="input-group">
                <label>Inserisci Numero Gara</label>
                <!-- DNA: [ID:4001-BIB-INPUT] -->
                <input type="number" id="bib-number" class="bib-input" placeholder="000" data-dna="4001-BIB-INPUT">
            </div>
            <!-- DNA: [ID:4002-LOGIN-BTN] -->
            <button onclick="handleLogin()" class="btn-main btn-yellow" data-dna="4002-LOGIN-BTN">ACCEDI ALLA
                GARA</button>
        </div>

        <!-- RACE SCREEN -->
        <!-- DNA: [URL:https://www.rengatreffen.it/race-app ID:5000-RACE-ENGINE] -->
        <div id="race-ui" class="race-card" data-dna="5000-RACE-ENGINE" data-component="RACE-ENGINE">
            <div class="team-info">
                <!-- DNA: [ID:5001-BADGE] -->
                <div id="team-badge" class="card-badge" data-dna="5001-BADGE">SCHEDA ...</div>
                <!-- DNA: [ID:5002-PHOTO-NUM] -->
                <div id="photo-display" class="photo-number" data-dna="5002-PHOTO-NUM">FOTO 1</div>
                <div class="status-pill" data-dna="SYSTEM-STATUS">
                    <div class="dot"></div> SISTEMA PRONTO
                </div>
            </div>

            <!-- CAMERA INPUT NASCOSTO -->
            <input type="file" accept="image/*" capture="camera" id="camera-input" style="display:none"
                onchange="processCameraSelection(event)">

            <!-- DNA: [ID:5003-SHOOT] -->
            <button onclick="triggerCamera()" id="shoot-btn" class="btn-shoot" data-dna="5003-SHOOT">📸 SCATTA E
                REGISTRA</button>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
                <!-- DNA: [ID:5004-SYNC] -->
                <button onclick="syncOfflineData()" class="btn-main btn-yellow"
                    style="font-size: 0.7rem; padding: 10px;" data-dna="5004-SYNC">🔄 SINCRONIZZA ORA</button>
                <!-- DNA: [ID:5005-LOGOUT] -->
                <button onclick="logout()" class="btn-main"
                    style="font-size: 0.7rem; color: #666; background: #333; padding: 10px;"
                    data-dna="5005-LOGOUT">CHIUDI SESSIONE</button>
            </div>

            <p style="text-align: center; font-size: 0.7rem; color: #555; margin-top: 20px;">
                Il ricalcolo orario è automatico e invisibile.<br>Calcola i tuoi tempi con cura.
            </p>

            <button id="reset-btn" onclick="resetTestMode()"
                style="display:none; background:transparent; border:1px dashed #444; color:#444; padding:10px 20px; border-radius:50px; margin-top:40px; cursor:pointer; font-size:0.7rem; font-weight:900;">
                🧹 RESET GARA (SOLO TEST)
            </button>
        </div>

        <footer class="footer">
            v7.9.1 DEV-GUARD | powered by MotoReporter
        </footer>
    </div>

    <script type="module">
        import { supabase } from '/src/lib/supabaseClient.js';

        let currentTeam = null;
        let photoNumber = 1;
        let pendingLogs = JSON.parse(localStorage.getItem('RENGATREFFEN_PENDING_LOGS') || '[]');
        let deferredPrompt;
        let isDevMode = false;

        function checkDevMode() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('dev') === 'true' || localStorage.getItem('RENGATREFFEN_DEV_MODE') === 'true') {
                isDevMode = true;
                document.getElementById('dev-pill').style.display = 'inline-flex';
                document.getElementById('reset-btn').style.display = 'inline-block';
            }
        }
        checkDevMode();

        // 🌟 PWA INSTALL LOGIC
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'block';
        });

        window.addEventListener('appinstalled', () => {
            document.getElementById('install-banner').style.display = 'none';
        });

        document.getElementById('install-banner').onclick = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') deferredPrompt = null;
            }
        };

        // 🔄 SYNC ENGINE
        async function syncOfflineData() {
            if (!navigator.onLine || pendingLogs.length === 0) {
                updateSyncStatus();
                return;
            }

            console.log(`[SYNC] Tentativo invio di ${pendingLogs.length} log pendenti...`);
            const stillPending = [];

            for (const log of pendingLogs) {
                try {
                    const { error } = await supabase.from('race_logs').insert([log]);
                    if (error) throw error;
                    console.log("[SYNC] Log inviato con successo!");
                } catch (err) {
                    console.error("[SYNC] Errore invio log:", err);
                    stillPending.push(log);
                }
            }

            pendingLogs = stillPending;
            localStorage.setItem('RENGATREFFEN_PENDING_LOGS', JSON.stringify(pendingLogs));
            updateSyncStatus();
        }

        // 📡 LIVE TRACKING ENGINE (Ogni 5 minuti)
        async function updateLiveTracking() {
            if (!currentTeam || !navigator.onLine) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                await supabase.from('live_tracking').upsert({
                    registration_id: currentTeam.id,
                    gps_lat: pos.coords.latitude,
                    gps_lng: pos.coords.longitude,
                    last_seen: new Date().toISOString()
                }, { onConflict: 'registration_id' });
                console.log("[LIVE] Posizione aggiornata per Ambrogio Eye.");
            }, null, { enableHighAccuracy: true });
        }
        setInterval(updateLiveTracking, 300000); // 5 minuti

        // Batti il colpo ogni 30 secondi
        setInterval(syncOfflineData, 30000);
        window.addEventListener('online', syncOfflineData);

        function updateSyncStatus() {
            const pill = document.querySelector('.status-pill');
            if (!pill) return;

            if (pendingLogs.length > 0) {
                pill.innerHTML = `<div class="dot" style="background:#FFCC00; box-shadow:0 0 10px #FFCC00"></div> ${pendingLogs.length} INVIO PENDENTE...`;
                pill.style.color = '#FFCC00';
            } else {
                pill.innerHTML = `<div class="dot"></div> SISTEMA SINCRONIZZATO`;
                pill.style.color = '#4CAF50';
            }
        }

        window.handleLogin = async function () {
            const bib = document.getElementById('bib-number').value;
            if (!bib) return;

            const { data, error } = await supabase
                .from('registrations')
                .select('*')
                .eq('bib_number', bib)
                .single();

            if (error || !data) {
                Swal.fire('Errore', 'Numero gara non trovato.', 'error');
                return;
            }

            currentTeam = data;

            const { count } = await supabase
                .from('race_logs')
                .select('*', { count: 'exact', head: true })
                .eq('registration_id', currentTeam.id);

            const localCountForTeam = pendingLogs.filter(l => l.registration_id === currentTeam.id).length;

            photoNumber = (count || 0) + localCountForTeam + 1;
            updateUI();
            updateLiveTracking();
            syncOfflineData();
        }

        function updateUI() {
            const color = currentTeam.card_color || 'ROSSA';
            const badge = document.getElementById('team-badge');
            badge.innerText = `SCHEDA ${color}`;
            badge.style.color = color === 'ROSSA' ? '#ff4444' : (color === 'GIALLA' ? '#FFCC00' : '#E6007E');

            document.getElementById('photo-display').innerText = `FOTO ${photoNumber}`;
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('race-ui').style.display = 'block';
            updateSyncStatus();
        }

        // 📸 LOGICA FOTOCAMERA
        window.triggerCamera = function () {
            document.getElementById('camera-input').click();
        }

        window.processCameraSelection = function (event) {
            const file = event.target.files[0];
            if (file) {
                handleShoot();
            }
        }

        window.handleShoot = async function () {
            const btn = document.getElementById('shoot-btn');
            const fileInput = document.getElementById('camera-input');
            const file = fileInput.files[0];

            if (!file) {
                Swal.fire('Errore', 'Nessuna foto acquisita.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'CARICAMENTO...';

            const saveData = async (pos, photoUrl = null) => {
                const newLog = {
                    registration_id: currentTeam.id,
                    photo_number: photoNumber,
                    gps_lat: pos ? pos.coords.latitude : null,
                    gps_lng: pos ? pos.coords.longitude : null,
                    gps_alt: pos ? pos.coords.altitude : null,
                    photo_url: photoUrl,
                    client_timestamp: new Date().toISOString()
                };

                try {
                    // Proviamo ad inviare subito se online, altrimenti coda (il log, non la foto)
                    const { error } = await supabase.from('race_logs').insert([newLog]);
                    if (error) throw error;

                    Swal.fire({
                        title: 'SUCCESSO!',
                        text: `Foto ${photoNumber} registrata correttamente.`,
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } catch (err) {
                    console.warn("Offline o Errore DB, salvo localmente:", err);
                    pendingLogs.push(newLog);
                    localStorage.setItem('RENGATREFFEN_PENDING_LOGS', JSON.stringify(pendingLogs));
                }

                photoNumber++;
                updateUI();
                btn.disabled = false;
                btn.innerText = '📸 SCATTA E REGISTRA';
                fileInput.value = ""; // Pulisci per il prossimo scatto
                syncOfflineData();
            };

            // 1. Upload Storage (se online)
            let photoUrl = null;
            if (navigator.onLine) {
                try {
                    const fileExt = file.name.split('.').pop() || 'jpg';
                    const fileName = `${currentTeam.bib_number}_P${photoNumber}_${Date.now()}.${fileExt}`;

                    const { data, error } = await supabase.storage
                        .from('race_photos')
                        .upload(fileName, file);

                    if (error) throw error;

                    const { data: publicUrl } = supabase.storage
                        .from('race_photos')
                        .getPublicUrl(fileName);

                    photoUrl = publicUrl.publicUrl;
                } catch (err) {
                    console.error("Storage upload failed:", err);
                }
            }

            // 2. Get GPS e salva log
            navigator.geolocation.getCurrentPosition(
                (pos) => saveData(pos, photoUrl),
                (err) => {
                    console.warn("GPS fallito, procedo solo con foto:", err);
                    saveData(null, photoUrl);
                },
                { enableHighAccuracy: true, timeout: 7000 }
            );
        }

        window.resetTestMode = function () {
            if (confirm("VUOI AZZERARE I LOG LOCALI E REINIZIARE IL TEST?")) {
                localStorage.removeItem('RENGATREFFEN_PENDING_LOGS');
                location.reload();
            }
        }

        // Prova a sincronizzare all'avvio
        syncOfflineData();

        // 🛠️ SERVICE WORKER REGISTRATION (OFFLINE SUPPORT)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('[PWA] Service Worker registrato con successo.');
                }).catch(err => {
                    console.error('[PWA] Errore registrazione SW:', err);
                });
            });
        }
    </script>
    <script type="module" src="/src/plugins/renga-dev-loader-v1.js"></script>
</body>

</html>
